on:
  push:
    tags: ["*"]
    branches: [main, elm-refactor]

jobs:
  build:
    runs-on: ubuntu-slim
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
    - uses: actions/checkout@v4
    - uses: asgr-dk/actions/.github/actions/get-elm@1.0.0
    - uses: asgr-dk/actions/.github/actions/get-esbuild@1.0.0
    - name: Run build script
      run: |
        set -euo pipefail
        elm make source/Main.elm --optimize --output=build/main.js
        sed -i 's/(this));/(globalThis));export const Elm = globalThis.Elm;/g' build/main.js
        esbuild --bundle --allow-overwrite --minify --outfile=_extension/source/Main.ts --pure:F \
          --pure:F2 --pure:F3 --pure:F4 --pure:F5 --pure:F6 --pure:F7 --pure:F8 --pure:F9 \
          --pure:A2 --pure:A3 --pure:A4 --pure:A5 --pure:A6 --pure:A7 --pure:A8 --pure:A9 \
          source/Main.ts
        mv elm.tmLanguage.json language-configuration.json license.md logo.jpg package.json readme.md _extension
    - uses: actions/upload-artifact@v4
      if: github.ref_type == 'tag'
      with:
        name: extension
        path: _extension
        retention-days: 1

  publish:
    runs-on: ubuntu-slim
    needs: build
    if: github.ref_type == 'tag'
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: _extension
      - name: Match tag with package.json
        run: |
          GIT_TAG="${{ github.ref_name }}"
          PKG_VERSION=$(jq -r '.version' _extension/package.json)
          if [ "$GIT_TAG" != "$PKG_VERSION" ]; then
            echo "::error::Mismatch: tag=$GIT_TAG, package.json=$PKG_VERSION"
            exit 1
          fi
      - name: Install Visual Studio Code Extension Manager
        run: npm install @vscode/vsce@4.0.1-3
      - name: Package Extension
        run: cd _extension && npx @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: _extension/*.vsix
      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish